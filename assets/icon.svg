<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- THINK WRONG app icon. Original mark: a question/redirection — an arrow that
       bends away from the "obvious" straight path. No third-party art. -->
  <rect width="128" height="128" rx="28" fill="#15131c"/>
  <!-- faint "obvious" straight path -->
  <line x1="30" y1="64" x2="98" y2="64" stroke="#3a3550" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 12"/>
  <!-- the actual (bent) path -->
  <path d="M30 88 L30 48 Q30 40 38 40 L78 40" fill="none" stroke="#c9a7ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrowhead turning upward, away from the obvious -->
  <path d="M78 40 L70 33 M78 40 L70 47" fill="none" stroke="#c9a7ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="30" cy="88" r="7" fill="#e9e6f2"/>
</svg>
