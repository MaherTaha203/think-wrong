name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# THINK WRONG prototype CI. Downloads Godot 4.3, parse-checks every script via
# an editor import, runs deterministic/save/boot/graphical QA, and verifies a
# native Android debug APK can be exported. No production signing secrets.
jobs:
  godot:
    name: Parse-check, tests & boot
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot $GODOT_VERSION headless
        run: |
          URL="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
          curl -sSL -o godot.zip "$URL"
          unzip -q godot.zip
          mv Godot_v$GODOT_VERSION-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import project (parse-checks every script)
        run: |
          ./godot --headless --editor --quit --path . 2>&1 | tee import.log || true
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" import.log; then
            echo "::error::GDScript parse/compile errors found"; exit 1
          fi
      - name: Deterministic tests (forward, reverse, shuffled)
        run: |
          ./godot --headless --path . --script tests/gdscript/run_tests.gd
          ./godot --headless --path . --script tests/gdscript/run_tests.gd -- --order=reverse
          ./godot --headless --path . --script tests/gdscript/run_tests.gd -- --order=shuffle:$GITHUB_RUN_NUMBER
      - name: Save I/O integration (isolated temp save, real autoloads)
        run: ./godot --headless --path . res://tests/integration/save_io_test.tscn
      - name: Boot smoke test (no runtime errors)
        run: |
          timeout 8 ./godot --headless --path . 2>&1 | tee boot.log || true
          if grep -qE "SCRIPT ERROR|ERROR: .*res://" boot.log; then
            echo "::error::runtime errors on boot"; exit 1
          fi
      - name: Graphical QA tour (touch input, layout, screenshots)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          for R in 720x1280 720x1600 960x1280; do
            TW_QA_OUT="$PWD/qa" xvfb-run -a -s "-screen 0 1280x1800x24" \
              ./godot --path . --display-driver x11 --rendering-driver opengl3 \
              --audio-driver Dummy --resolution "$R" res://tests/visual/qa_tour.tscn
          done
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-tour
          path: qa/
          if-no-files-found: ignore

  android-export:
    name: Android debug APK export
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK components
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34"
      - name: Download Godot $GODOT_VERSION headless
        run: |
          URL="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
          curl -sSL -o godot.zip "$URL"
          unzip -q godot.zip
          mv Godot_v$GODOT_VERSION-stable_linux.x86_64 godot
          chmod +x godot
      - name: Install Android export template
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_export_templates.tpz"
          unzip -q templates.tpz -d templates
          cp templates/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/android_debug.apk"
      - name: Create temporary debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Import project
        run: ./godot --headless --editor --quit --path .
      - name: Export Android debug APK
        run: |
          rm -rf build/android
          mkdir -p build/android
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore" \
          GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey \
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android \
          ./godot --headless --path . --export-debug "Android" build/android/THINK_WRONG.apk
          test -s build/android/THINK_WRONG.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: think-wrong-android-debug
          path: build/android/THINK_WRONG.apk
          if-no-files-found: error
