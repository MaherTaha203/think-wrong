name: Android Release Rehearsal

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release-rehearsal:
    name: Build signed AAB with ephemeral CI key
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK components
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Download Godot $GODOT_VERSION headless
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
          curl -sSL -o godot.zip "$URL"
          unzip -q godot.zip
          mv "Godot_v$GODOT_VERSION-stable_linux.x86_64" godot
          chmod +x godot

      - name: Install matching Android export templates
        shell: bash
        run: |
          set -euo pipefail
          DEST="$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          mkdir -p "$DEST"
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_export_templates.tpz"
          unzip -q templates.tpz -d templates
          test -s templates/templates/android_release.apk
          test -s templates/templates/android_debug.apk
          test -s templates/templates/android_source.zip
          cp templates/templates/android_release.apk "$DEST/android_release.apk"
          cp templates/templates/android_debug.apk "$DEST/android_debug.apk"
          cp templates/templates/android_source.zip "$DEST/android_source.zip"

      - name: Create ephemeral release keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v             -keystore "$RUNNER_TEMP/rehearsal.keystore"             -alias thinkwrong-rehearsal             -keyalg RSA -keysize 2048 -validity 2             -storepass rehearsal             -keypass rehearsal             -dname "CN=THINK WRONG CI Rehearsal,O=THINK WRONG,C=PS"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/rehearsal.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=thinkwrong-rehearsal" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=rehearsal" >> "$GITHUB_ENV"

      - name: Import project
        run: ./godot --headless --editor --quit --path .

      - name: Export signed AAB
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/android
          mkdir -p build/android
          ./godot --headless --path . --export-release "Android Release" build/android/THINK_WRONG.aab
          test -s build/android/THINK_WRONG.aab

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail
          unzip -t build/android/THINK_WRONG.aab >/dev/null
          jarsigner -verify -strict -verbose build/android/THINK_WRONG.aab >/tmp/jarsigner.log 2>&1
          grep -q "jar verified" /tmp/jarsigner.log
          sha256sum build/android/THINK_WRONG.aab

      - name: Upload rehearsal AAB
        uses: actions/upload-artifact@v4
        with:
          name: think-wrong-android-release-rehearsal
          path: build/android/THINK_WRONG.aab
          if-no-files-found: error
